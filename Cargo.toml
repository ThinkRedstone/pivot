[workspace]
resolver = "3"
members = [
    "benchmarks",
    "bin",
    "catalog",
    "datastore-iceberg",
    "datastore-pivotlake",
    "dispatch",
    "duckdb-planner",
    "metastore-disk",
    "parquet-engine",
    "planner",
    "object-storage",
]
# arrow-rs (vendored submodule) and perfy are workspaces of their own; they
# resolve and lock independently.
exclude = ["arrow-rs", "perfy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# None of these crates is published to crates.io.
publish = false

[workspace.dependencies]
# Sibling crates.
catalog = { path = "catalog" }
datastore-iceberg = { path = "datastore-iceberg" }
datastore-pivotlake = { path = "datastore-pivotlake" }
dispatch = { path = "dispatch" }
duckdb-planner = { path = "duckdb-planner" }
metastore-disk = { path = "metastore-disk" }
parquet-engine = { path = "parquet-engine" }
planner = { path = "planner" }
object-storage = { path = "object-storage" }

# The vendored arrow-rs fork (git submodule). `parquet` is the strict,
# spec-compliant reader used only as a test oracle by crates with their own
# Parquet paths.
arrow = { path = "arrow-rs/arrow" }
arrow-arith = { path = "arrow-rs/arrow-arith" }
arrow-array = { path = "arrow-rs/arrow-array" }
arrow-buffer = { path = "arrow-rs/arrow-buffer" }
arrow-data = { path = "arrow-rs/arrow-data" }
arrow-cast = { path = "arrow-rs/arrow-cast" }
arrow-json = { path = "arrow-rs/arrow-json" }
arrow-ord = { path = "arrow-rs/arrow-ord" }
arrow-row = { path = "arrow-rs/arrow-row" }
arrow-schema = { path = "arrow-rs/arrow-schema" }
arrow-select = { path = "arrow-rs/arrow-select" }
parquet = { path = "arrow-rs/parquet", default-features = false, features = ["arrow", "snap"] }
parquet-variant = { path = "arrow-rs/parquet-variant" }
parquet-variant-compute = { path = "arrow-rs/parquet-variant-compute" }
parquet-variant-json = { path = "arrow-rs/parquet-variant-json" }

ahash = "0.8.12"
base64 = "0.22"
bytes = "1.11.0"
clap = { version = "4", features = ["derive"] }
core_affinity = "0.8.3"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
crossbeam-deque = "0.8.6"
crossbeam-queue = "0.3"
flate2 = "1"
insta = "1"
libc = "0.2.184"
lru = "0.18.1"
# Declared once for the workspace: the SCRAM derivation `metastore-disk` stores
# with must be the very pgwire the server verifies logins with.
pgwire = "0.39"
rand = "0.10.0"
rcgen = "0.13"
# Deleted-row bitmaps: the format Iceberg deletion vectors are stored in, and
# what a row group keeps its deleted positions as.
roaring = "0.11"
rstest = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
snap = { git = "https://github.com/pivotlake/rust-snappy.git", rev = "c1754fc37fe43db77c3b5428d57689cd5f2182a5" }
# Fork: adds `block::decompress_scattered` (vectored pages over cache
# buffers / ring slots). Default features off = the fast decode path.
lz4_flex = { git = "https://github.com/pivotlake/lz4_flex.git", rev = "a5cc41c918bbe0a2266db4cb7a1d16a406844d18", default-features = false, features = ["std"] }
# Same version the vendored parquet crate binds, so one libzstd is built.
zstd = { version = "0.13", default-features = false }
sysinfo = "0.38.0"
tempfile = "3"
thiserror = "2.0.18"
tokio = "1.40"
tokio-postgres = "0.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ureq = "2"
url = "2.5"
unicode-width = "0.2"

# Compiled dataflow operators nest their factory types, so an operator's type name
# embeds the full name of every stage beneath it. Full DWARF writes each of those
# names into `.debug_str` once per instantiation, which ends up being most of the
# bytes in a debug build. Line tables still give backtraces with file and line, and
# still symbolize under `perf`; what goes away is printing variables in gdb/lldb.
# Build with `CARGO_PROFILE_DEV_DEBUG=full` when you need to inspect values.
[profile.dev]
debug = "line-tables-only"

# Optimized like release but with debuginfo, so `perf` can resolve inlined
# frames and line numbers. Build for profiling with
# `cargo build --profile profiling`; plain `--release` stays lean.
[profile.profiling]
inherits = "release"
debug = true

# Route Delta Kernel's arrow and parquet onto the vendored arrow-rs fork instead
# of the crates.io releases, so the whole workspace shares one arrow. Kernel's
# `arrow`/`parquet` re-exports then resolve to the same crate our own code uses,
# collapsing the two otherwise-incompatible `RecordBatch` types into one. The
# fork is 58.0.0, which satisfies Kernel's `^58` requirement; codec features are
# unioned across consumers, so Kernel keeps every codec it asks for.
[patch.crates-io]
arrow = { path = "arrow-rs/arrow" }
arrow-arith = { path = "arrow-rs/arrow-arith" }
arrow-array = { path = "arrow-rs/arrow-array" }
arrow-buffer = { path = "arrow-rs/arrow-buffer" }
arrow-cast = { path = "arrow-rs/arrow-cast" }
arrow-csv = { path = "arrow-rs/arrow-csv" }
arrow-data = { path = "arrow-rs/arrow-data" }
arrow-ipc = { path = "arrow-rs/arrow-ipc" }
arrow-json = { path = "arrow-rs/arrow-json" }
arrow-ord = { path = "arrow-rs/arrow-ord" }
arrow-row = { path = "arrow-rs/arrow-row" }
arrow-schema = { path = "arrow-rs/arrow-schema" }
arrow-select = { path = "arrow-rs/arrow-select" }
arrow-string = { path = "arrow-rs/arrow-string" }
parquet = { path = "arrow-rs/parquet" }

[package]
name = "parquet-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PivotDB's Parquet metadata, scan, materialization, and write engines."

[dependencies]
planner = { workspace = true }
dispatch = { workspace = true }
object-storage = { workspace = true }
arrow-array = { workspace = true }
arrow-ord = { workspace = true }
arrow-row = { workspace = true }
arrow-arith = { workspace = true }
arrow-cast = { workspace = true }
arrow-schema = { workspace = true }
arrow-buffer = { workspace = true }
arrow-data = { workspace = true }
arrow-select = { workspace = true }
parquet-variant = { workspace = true }
parquet-variant-compute = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
crossbeam-deque = { workspace = true }
ahash = { workspace = true }
roaring = { workspace = true }
snap = { workspace = true }
# LZ4_RAW page decompression (the fork with scattered decode).
lz4_flex = { workspace = true }
# ZSTD page compression and decompression; the streaming decoder handles
# scattered buffers natively, so the stock crate suffices.
zstd = { workspace = true }

[dev-dependencies]
dispatch = { workspace = true, features = ["test-util"] }
# `lz4` and `zstd` so the round-trip tests' reference reader can decode files
# written under every PIVOT_PAGE_CODEC value, not only the snappy default.
parquet = { workspace = true, features = ["variant_experimental", "lz4", "zstd"] }
arrow-schema = { workspace = true }
arrow = { workspace = true, features = ["prettyprint"] }
parquet-variant = { workspace = true }
parquet-variant-compute = { workspace = true }
parquet-variant-json = { workspace = true }
tempfile = { workspace = true }
core_affinity = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "decode"
harness = false

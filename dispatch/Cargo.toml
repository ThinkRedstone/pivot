[package]
name = "dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow = { workspace = true, features = ["prettyprint"] }
arrow-buffer = { workspace = true }
arrow-ord = { workspace = true }
arrow-row = { workspace = true }
parquet-variant-compute = { workspace = true }

crossbeam-deque = { workspace = true }
crossbeam-queue = { workspace = true }
core_affinity = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
memchr = "2.7"
ahash = { workspace = true }

tikv-jemallocator = "0.6.0"

bytes = { workspace = true }
libc = { workspace = true }
# Identifier concatenation for the icelake_kernel! macro's generated twins.
paste = "1"
rand = { workspace = true }

# Cryptographic hash for the disk cache's content-addressed filenames: a stable
# spec (identical across versions/platforms) whose collisions can't be crafted,
# so adversarial object keys can't be made to alias one cache file. Pure-Rust
# SIMD by default (no cmake/C toolchain), matching the rustls+ring choice below.
blake3 = "1"

# HTTP(S) source support. rustls is sans-IO: we shuttle ciphertext between the
# socket (io_uring on Linux, blocking std::net elsewhere) and rustls's in-memory
# buffers, so TLS works identically on both backends. `ring` keeps the build lean
# (no cmake/C toolchain); roots are the bundled Mozilla set (no platform calls).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
# Byte-level HTTP/1.1 head parsing for the sans-IO range-read helpers
# (io::http::http1), driven from our own io_uring transport.
httparse = "1.9"
url = { workspace = true }

[features]
# Exposes `test_utils` and the test-only worker-waker / free-pool helpers so
# out-of-crate test suites (e.g. catalog's Parquet reader tests) can drive
# single operators. Enabled only via those crates' dev-dependencies.
test-util = []
# Per-query `perf` profiling support (used by the server's `perf` feature): a
# worker-tid registry + a "run only the profiled dataflow" gate in the worker
# loop. Off by default: no per-dataflow state, zero hot-loop overhead. Pulls
# nix's `process` feature for `gettid`.
perf = ["nix/process"]
# Parks an idle worker until it is notified, even in a release build. A plain
# release build caps the park at `waker::PARK_TIMEOUT` so a missed wake-up costs
# a short stall instead of a hang; debug builds always park unbounded. Passed by
# the benchmark builds so a missed wake-up is caught as a hang there too.
unbounded-park = []

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["fs", "uio"] }

# Non-Linux Unix (macOS) drives its blocking pread/pwrite pool over per-worker
# MPSC channels: pool threads `send` completions, the owning worker `try_recv`
# drains them and `recv`-parks in `submit_and_wait`. Off Linux's io_uring path.
[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = { workspace = true }
# Generate a self-signed cert so tests can stand up a loopback HTTPS server the
# client trusts via an injected root store.
rcgen = "0.13"
# Operator microbenchmarks (`benches/operators.rs`). `harness = false` below: we
# drive Criterion from our own `main` so a single `Dispatch` (worker pool) is
# spun up once and reused across every scenario, instead of per bench group.
criterion = { workspace = true }

[[bench]]
name = "operators"
harness = false

[[bench]]
name = "joins"
harness = false

# Full ORDER BY at scale (`benches/order_by.rs`): sorts and re-emits at least
# 1 GiB per scenario. Same custom-`main` Criterion setup as `operators`.
[[bench]]
name = "order_by"
harness = false

# HTTP(S) range-read throughput (`benches/http_range.rs`): stands up a loopback
# backend and drives the HTTP engine via a standalone `IORequester`. Needs
# `test-util` for `init_test_free_pool` (the out-of-crate single-worker context).
[[bench]]
name = "http_range"
harness = false
required-features = ["test-util"]

# `test-util` for `init_test_free_pool`, which backs the accumulator's slabs.
[[bench]]
name = "accumulator"
harness = false
required-features = ["test-util"]

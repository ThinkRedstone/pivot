[package]
name = "planner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `chrono-tz` so a cast to TIMESTAMP WITH TIME ZONE accepts a named zone such
# as `UTC`; without it arrow parses only fixed offsets.
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-schema = { workspace = true }
arrow-buffer = { workspace = true }
arrow-ord = { workspace = true }
arrow-arith = { workspace = true }
arrow = { workspace = true }
# `variant_get` runs arrow's variant path-extraction kernel over the scanned
# variant (JSON) struct column; `parquet-variant` supplies the path type and
# `parquet-variant-json` renders variant output columns as JSON text.
parquet-variant = { workspace = true }
parquet-variant-compute = { workspace = true }
parquet-variant-json = { workspace = true }
duckdb-planner = { workspace = true }
dispatch = { workspace = true }
# `Catalog::commit_transaction` is async (publishing an INSERT's files does
# blocking store I/O, offloaded to the blocking pool); `async-trait` keeps the
# trait object-safe.
async-trait = "0.1"
ahash = { workspace = true }
regex = "1"
pcre2 = "0.2"
thiserror = { workspace = true }
# Column/Type derive serde so catalog can persist a table's declared schema in its
# manifest.
serde = { workspace = true }

[dev-dependencies]
# The worker memory pool a unit test installs to run a filter's row selection off a worker.
dispatch = { workspace = true, features = ["test-util"] }
# The Parquet reader, for integration tests that plan over a real on-disk table.
parquet-engine = { workspace = true }
# `variant_experimental` so `ArrowWriter` stamps the VARIANT logical type on an
# extension-tagged variant field (the variant tests read it back through pivot).
parquet = { workspace = true, features = ["variant_experimental"] }
arrow-json = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
core_affinity = { workspace = true }
insta = { workspace = true }
rstest = { workspace = true }
